<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="קורס אינטראקטיבי בעברית ללימוד GitHub ו-GitHub Copilot" />
  <title>קורס GitHub בעברית · למידה אינטראקטיבית</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/themes.css" />
  <link rel="stylesheet" href="css/main.css" />
</head>
<body data-theme="light">
  <!-- ===== Header ===== -->
  <header class="app-header" id="appHeader">
    <div class="header-inner">
      <button class="brand" id="brandBtn" aria-label="חזרה לדף הבית">
        <span class="brand-logo" aria-hidden="true">🐙</span>
        <span class="brand-text">קורס GitHub בעברית</span>
      </button>

      <nav class="main-nav" id="mainNav" aria-label="ניווט ראשי">
        <button class="nav-link" data-route="home">בית</button>
        <button class="nav-link" data-route="dashboard">לוח התקדמות</button>
        <button class="nav-link" data-route="map">מפת הקורס</button>
        <button class="nav-link" data-route="about">בטיחות</button>
      </nav>

      <div class="header-actions">
        <button class="icon-btn" id="themeToggle" aria-label="החלפת מצב כהה/בהיר" title="מצב כהה/בהיר">🌙</button>
        <button class="icon-btn" id="navToggle" aria-label="תפריט" title="תפריט">☰</button>
      </div>
    </div>
  </header>

  <!-- ===== Main view container ===== -->
  <main id="view" class="view" tabindex="-1" aria-live="polite"></main>

  <!-- ===== Study Assistant (floating) ===== -->
  <div class="assistant" id="assistant" hidden>
    <div class="assistant-panel" id="assistantPanel" role="dialog" aria-label="עוזר לימודי" hidden>
      <div class="assistant-head">
        <strong>🤝 עוזר לימודי</strong>
        <button class="icon-btn" id="assistantClose" aria-label="סגור">✕</button>
      </div>
      <div class="assistant-body" id="assistantBody"></div>
      <div class="assistant-actions" id="assistantActions"></div>
    </div>
    <button class="assistant-fab" id="assistantFab" aria-label="פתח עוזר לימודי">🤝</button>
  </div>

  <!-- ===== Toast ===== -->
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <footer class="app-footer">
    <p>קורס לימודי עצמאי · כל התרגול מתבצע ב-<strong>GitHub.com</strong> · אינו מבקש סיסמאות או מפתחות</p>
  </footer>

  <!-- Data + logic -->
  <script src="js/data.js"></script>
  <script src="js/state.js"></script>
  <script src="js/speech.js"></script>
  <script src="js/gamification.js"></script>
  <script src="js/assistant.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/lessons.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
